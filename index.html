<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>+-
<body>

<div class="card">
    
    <div class="inputs">
        <div>
            <label>DAY</label>
            <input type="number" id="day" placeholder="DD">
        </div>
        <div>
            <label>MONTH</label>
            <input type="number" id="month" placeholder="MM">
        </div>
        <div>
            <label>YEAR</label>
            <input type="number" id="year" placeholder="YYYY">
        </div>
    </div>

    <div class="line">
        <hr>
        <button onclick="calculateAge()">➜</button>
    </div>

    <div class="result">
        <h1><span id="years">--</span> years</h1>
        <h1><span id="months">--</span> months</h1>
        <h1><span id="days">--</span> days</h1>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
